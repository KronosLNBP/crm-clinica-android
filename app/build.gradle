plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'mx.com.grupoempresarialdiaz.crm'
    compileSdk 35

    defaultConfig {
        applicationId 'mx.com.grupoempresarialdiaz.crm'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        // Dirección del CRM (con diagonal final). Para producción cambia esta línea.
        buildConfigField 'String', 'BASE_URL', '"https://grupoempresarialdiaz.com.mx/dash/dash/"'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
