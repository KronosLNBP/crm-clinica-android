plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'mx.com.grupoempresarialdiaz.crm'
    compileSdk 35

    defaultConfig {
        applicationId 'mx.com.grupoempresarialdiaz.crm'
        minSdk 21
        targetSdk 35
        versionCode 3
        versionName '0.1.2'
        // Dirección del CRM (con diagonal final). Para producción cambia esta línea.
        buildConfigField 'String', 'BASE_URL', '"https://grupoempresarialdiaz.com.mx/dash/dash/"'
    }

    // Llave FIJA solo para versiones de prueba: así cada APK nuevo se instala encima del anterior.
    // NO usar para Play Store (esa llave se crea aparte y no se sube al repo).
    signingConfigs {
        pruebas {
            storeFile file('pruebas.keystore')
            storePassword 'clinica-pruebas'
            keyAlias 'pruebas'
            keyPassword 'clinica-pruebas'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.pruebas }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // Permite usar fechas (java.time) en Android 5-7, como BlueStacks
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.2'
}
