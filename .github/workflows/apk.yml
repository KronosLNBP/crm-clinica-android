# Compila la app nativa en los servidores de GitHub (no hay que instalar Android Studio).
# Descarga: pestaña Actions → "Compilar APK" → ejecución más reciente → Artifacts → CrmClinica-apk
name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compilar APK de prueba
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: CrmClinica-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
